server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 20m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    # Uploaded business assets never reach PHP, even if old files exist.
    location ^~ /storage/businesses/ {
        if ($uri !~* "\.(png|jpe?g|webp|gif)$") { return 403; }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        try_files $uri =404;
    }
    # Uploaded media may legitimately contain SVG (admin library). SVG is the
    # one static format that can execute script when opened directly, so it is
    # served sandboxed (no scripts, no same-origin access) in addition to the
    # upload-time content check in AdminController.
    location ~* ^/storage/.*\.svg$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        try_files $uri =404;
    }
    # PRIVATE template artwork (personal + review-stage submissions) lives on
    # the private disk and is served ONLY by the ownership-checked API
    # endpoint. Legacy files may still exist under the old public path, so this
    # namespace is refused HERE too (defense in depth: a ^~ prefix location
    # outranks the extension regex locations below, which would otherwise
    # happily serve /storage/templates/users/**/*.png).
    location ^~ /storage/templates/users/ {
        return 404;
    }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|woff2?)$ {
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }
    location ~ /\.(?!well-known).* { deny all; }
}
