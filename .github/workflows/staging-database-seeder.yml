name: Staging Database Seeder

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
      confirmation:
        description: Enter exactly RUN_DATABASE_SEED (surrounding spaces are ignored)
        required: true
        type: string
      provision_admin:
        description: Also create/rotate the staging admin (from STAGING_ADMIN_* secrets)
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: staging-database-seeder
  cancel-in-progress: false

jobs:
  seed:
    name: Seed staging database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
    env:
      IMAGE: staging-database-seeder:${{ github.run_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate branch and manual confirmation
        env:
          TARGET: ${{ inputs.target }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          # Manual workflow_dispatch inputs are easy to paste with a stray
          # leading/trailing space (one run failed on ' RUN_DATABASE_SEED').
          # Trim surrounding whitespace before the exact-match guards; the
          # comparison itself stays strict (case-sensitive, no internal spaces).
          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }

          target="$(trim "$TARGET")"
          confirmation="$(trim "$CONFIRMATION")"

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "This workflow may run only from the main branch."
            exit 1
          fi

          if [[ "$target" != "staging" ]]; then
            echo "The target must be staging."
            exit 1
          fi

          if [[ "$confirmation" != "RUN_DATABASE_SEED" ]]; then
            echo "Confirmation must exactly equal RUN_DATABASE_SEED."
            exit 1
          fi

      - name: Build disposable seeder image
        run: |
          set -euo pipefail
          docker build --file api/Dockerfile --tag "$IMAGE" api

      - name: Read-only preflight and seed
        env:
          DB_URL: ${{ secrets.NEON_STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${DB_URL:-}" ]]; then
            echo "NEON_STAGING_DATABASE_URL is empty."
            exit 1
          fi

          cleanup() {
            docker image rm "$IMAGE" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          read -r -d '' PREFLIGHT <<'PHP' || true
          $url = getenv('DB_URL');
          if ($url === false || $url === '') {
              fwrite(STDERR, "DB_URL is empty.\n");
              exit(1);
          }

          $parts = parse_url($url);
          if ($parts === false || empty($parts['host']) || empty($parts['path'])) {
              fwrite(STDERR, "DB_URL is not a valid PostgreSQL URL.\n");
              exit(1);
          }

          $host = strtolower($parts['host']);
          $blocked = $host === 'localhost'
              || $host === '127.0.0.1'
              || $host === 'postgres'
              || $host === 'render.com'
              || str_ends_with($host, '.render.com')
              || $host === 'onrender.com'
              || str_ends_with($host, '.onrender.com');
          if ($blocked) {
              fwrite(STDERR, "The database destination is blocked by workflow guardrails.\n");
              exit(1);
          }

          if ($host !== 'neon.tech' && ! str_ends_with($host, '.neon.tech')) {
              fwrite(STDERR, "The database hostname is not a Neon hostname.\n");
              exit(1);
          }

          $expectedDatabase = rawurldecode(ltrim($parts['path'], '/'));
          if ($expectedDatabase === '') {
              fwrite(STDERR, "DB_URL does not identify a database.\n");
              exit(1);
          }

          $port = $parts['port'] ?? 5432;
          $dsn = 'pgsql:host=' . $host . ';port=' . $port . ';dbname=' . $expectedDatabase . ';sslmode=require';
          try {
              $pdo = new PDO(
                  $dsn,
                  rawurldecode($parts['user'] ?? ''),
                  rawurldecode($parts['pass'] ?? ''),
                  [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]
              );

              $identity = $pdo->query(
                  'SELECT current_database() AS database_name, current_schema() AS schema_name'
              )->fetch(PDO::FETCH_ASSOC);
              if (($identity['database_name'] ?? null) !== $expectedDatabase) {
                  fwrite(STDERR, "The connected database identity does not match DB_URL.\n");
                  exit(1);
              }
              if (($identity['schema_name'] ?? null) !== 'public') {
                  fwrite(STDERR, "The current schema is not public.\n");
                  exit(1);
              }

              $requiredTables = ['roles', 'permissions', 'permission_role', 'site_settings'];
              $statement = $pdo->prepare(
                  "SELECT table_name FROM information_schema.tables
                   WHERE table_schema = 'public' AND table_type = 'BASE TABLE'
                     AND table_name = ANY (CAST(:tables AS text[]))"
              );
              $statement->execute(['tables' => '{' . implode(',', $requiredTables) . '}']);
              $foundTables = array_column($statement->fetchAll(PDO::FETCH_ASSOC), 'table_name');
              $missingTables = array_diff($requiredTables, $foundTables);
              if ($missingTables !== []) {
                  fwrite(STDERR, "Required staging tables are missing.\n");
                  exit(1);
              }
          } catch (Throwable $exception) {
              fwrite(STDERR, "Read-only database preflight failed.\n");
              exit(1);
          }

          echo "Read-only preflight passed: connection, database identity, public schema, and required tables verified.\n";
          PHP

          # The preflight above is read-only. It does not run migrations or any schema-changing command.
          docker run --rm \
            --env APP_ENV=staging \
            --env APP_DEBUG=false \
            --env DB_CONNECTION=pgsql \
            --env DB_URL \
            "$IMAGE" php -r "$PREFLIGHT"

          echo "WARNING: This operation modifies staging roles, permissions, permission_role, and site_settings."
          echo "WARNING: It does not run migrations and does not create an admin user."
          docker run --rm \
            --env APP_ENV=staging \
            --env APP_DEBUG=false \
            --env DB_CONNECTION=pgsql \
            --env DB_URL \
            "$IMAGE" php artisan db:seed --class='Database\Seeders\DatabaseSeeder' --force

      - name: Provision staging admin (optional)
        id: provision
        if: ${{ inputs.provision_admin }}
        env:
          DB_URL: ${{ secrets.NEON_STAGING_DATABASE_URL }}
          ADMIN_PHONE: ${{ secrets.STAGING_ADMIN_PHONE }}
          ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL || 'admin@golestani.ir' }}
        run: |
          set -euo pipefail

          if [[ -z "${ADMIN_PHONE:-}" || -z "${ADMIN_PASSWORD:-}" ]]; then
            echo "Skipping admin provisioning: STAGING_ADMIN_PHONE or STAGING_ADMIN_PASSWORD secret is not set."
            echo "provisioned=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "provisioned=true" >> "$GITHUB_OUTPUT"
          echo "WARNING: This creates or rotates the staging admin user for ADMIN_PHONE and deletes its existing tokens."

          # The seed step's EXIT trap already removed the disposable image, so
          # rebuild it here — the runner's Docker layer cache makes this fast.
          docker build --file api/Dockerfile --tag "$IMAGE" api

          docker run --rm \
            --env APP_ENV=staging \
            --env APP_DEBUG=false \
            --env DB_CONNECTION=pgsql \
            --env DB_URL \
            --env ADMIN_PHONE \
            --env ADMIN_PASSWORD \
            --env ADMIN_EMAIL \
            "$IMAGE" php artisan admin:provision-from-env

      - name: Verify staging admin
        id: verify_admin
        if: ${{ inputs.provision_admin && steps.provision.outputs.provisioned == 'true' }}
        env:
          DB_URL: ${{ secrets.NEON_STAGING_DATABASE_URL }}
          ADMIN_PHONE: ${{ secrets.STAGING_ADMIN_PHONE }}
          ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          # A stray space in the phone secret would pass provisioning (the
          # command trims internally) but then miss the DB row and the login
          # probe — trim it here too. The password is intentionally NOT trimmed.
          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }
          ADMIN_PHONE="$(trim "$ADMIN_PHONE")"

          # The seed step's EXIT trap already removed the disposable image, so
          # rebuild it here — the runner's Docker layer cache makes this fast.
          docker build --file api/Dockerfile --tag "$IMAGE" api

          # 1) Read-only database check: user exists, is active, has the admin role.
          read -r -d '' VERIFY <<'PHP' || true
          $url = getenv('DB_URL');
          $parts = parse_url($url);
          $dsn = 'pgsql:host=' . strtolower($parts['host']) . ';port=' . ($parts['port'] ?? 5432)
              . ';dbname=' . rawurldecode(ltrim($parts['path'], '/')) . ';sslmode=require';
          $pdo = new PDO($dsn, rawurldecode($parts['user'] ?? ''), rawurldecode($parts['pass'] ?? ''),
              [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);

          $statement = $pdo->prepare(
              "SELECT u.id, u.is_active,
                      EXISTS (SELECT 1 FROM role_user ru JOIN roles r ON r.id = ru.role_id
                              WHERE ru.user_id = u.id AND r.name = 'admin') AS is_admin
                 FROM users u WHERE u.phone = :phone"
          );
          $statement->execute([':phone' => getenv('ADMIN_PHONE')]);
          $row = $statement->fetch(PDO::FETCH_ASSOC);

          if ($row === false) {
              fwrite(STDERR, "Verification failed: no user found for the ADMIN_PHONE.\n");
              exit(1);
          }
          $isActive = in_array($row['is_active'], [true, 't', 'true', 1, '1'], true);
          $isAdmin = in_array($row['is_admin'], [true, 't', 'true', 1, '1'], true);
          if (! $isActive || ! $isAdmin) {
              fwrite(STDERR, "Verification failed: user #{$row['id']} is_active=" . var_export($row['is_active'], true)
                  . " is_admin=" . var_export($row['is_admin'], true) . "\n");
              exit(1);
          }

          echo "Database verification passed: user #{$row['id']} exists, is active, and has the admin role.\n";
          PHP

          docker run --rm \
            --env APP_ENV=staging \
            --env APP_DEBUG=false \
            --env DB_CONNECTION=pgsql \
            --env DB_URL \
            --env ADMIN_PHONE \
            "$IMAGE" php -r "$VERIFY"

          # 2) Real login probe against the Render API: only the HTTP status is
          # printed — the response body (which contains the token) is discarded.
          # jq builds the JSON body so special characters in the password secret
          # cannot break the payload.
          login_payload="$(jq -n --arg identifier "$ADMIN_PHONE" --arg password "$ADMIN_PASSWORD" \
            '{identifier: $identifier, password: $password}')"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data "$login_payload" \
            'https://one-ns2s.onrender.com/api/auth/admin/login')"

          echo "Admin login probe returned HTTP ${status}."
          if [[ "$status" != "200" ]]; then
            echo "Verification failed: expected HTTP 200 from the admin login endpoint."
            exit 1
          fi

      - name: Verify public homepage
        run: |
          set -euo pipefail

          homepage="$(curl --fail --silent --show-error --max-time 30 \
            'https://one-ns2s.onrender.com/api/public/homepage')"

          if [[ -z "$homepage" ]]; then
            echo "The public homepage response was empty."
            exit 1
          fi

          if ! printf '%s' "$homepage" | jq -e \
            '((type == "object" or type == "array") and length > 0)' >/dev/null; then
            echo "The public homepage response was not non-empty JSON content."
            exit 1
          fi

          echo "Public homepage verification passed with a successful, non-empty JSON response."
