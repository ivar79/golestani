services:
  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: golestani-php:8.3
    container_name: golestani-api
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./api:/var/www/html
    ports:
      - "8000:8000"
    env_file:
      - ./api/.env
    command: php artisan serve --host=0.0.0.0 --port=8000
    networks:
      - golestani-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: golestani-php:8.3
    container_name: golestani-worker
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./api:/var/www/html
    env_file:
      - ./api/.env
    command: php artisan queue:work redis --sleep=3 --tries=3
    networks:
      - golestani-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgis/postgis:16-3.4
    container_name: golestani-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-golestani}
      POSTGRES_USER: ${DB_USERNAME:-golestani}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - golestani-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-golestani}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: golestani-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - golestani-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  golestani-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
