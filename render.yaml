# Render Blueprint — Golestani backend (Laravel 12, PHP 8.3)
# Docs: https://render.com/docs/blueprint-spec
# The Next.js frontend deploys separately on Vercel with Root Directory = web
# (see DEPLOYMENT.md and vercel.json at the repo root).

services:
  # Redis (Render Key Value) — cache / session / queue backend, per the
  # declared stack: Laravel + PHP 8.3 / PostgreSQL + PostGIS / Redis.
  - type: keyvalue
    name: golestani-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []            # internal connections from golestani-api only

  - type: web
    name: golestani-api
    runtime: docker            # Docker runtime — builds api/Dockerfile
    dockerfilePath: ./Dockerfile   # relative to rootDir (api/)
    dockerContext: .              # relative to rootDir (api/)
    plan: free
    region: frankfurt          # closest Render region to Iran/EU audience
    rootDir: api
    # NOTE: no preDeployCommand — it is a paid-plans-only Render feature and
    # this service runs on the free plan. docker/start.sh already runs
    # `php artisan migrate --force` on every boot BEFORE nginx serves traffic,
    # so schema freshness is preserved on each deploy. PostGIS can be checked
    # anytime with `php artisan db:validate-postgis` (kept as a standalone
    # command; the staging seeder workflow also guards schema freshness).
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true        # generated once at first deploy; keep stable afterwards
      - key: APP_URL
        sync: false                # set to https://golestani-api.onrender.com in dashboard
      # Laravel 12 accepts DATABASE_URL (postgres://...) directly
      - key: DATABASE_URL
        sync: false                # point at a PostGIS-capable DB (Neon) — see note below
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      # Cache/session/queue on Redis (the keyvalue service above).
      # REDIS_URL is injected from the keyvalue service's connection string.
      - key: REDIS_URL
        fromService:
          name: golestani-redis
          type: keyvalue
          property: connectionString
      - key: REDIS_CLIENT
        value: predis           # pure-PHP client — no phpredis extension needed
      - key: CACHE_STORE
        value: redis
      - key: SESSION_DRIVER
        value: redis
      - key: QUEUE_CONNECTION
        value: redis
      - key: LOG_CHANNEL
        value: stderr
      # OTP must never be exposed in production
      - key: OTP_DEMO_MODE
        value: "false"
      # SMS gateway — wire real credentials later
      - key: SMS_DRIVER
        value: log
      # Lock CORS to the deployed Vercel origin (config/cors.php reads this)
      - key: CORS_ALLOWED_ORIGINS
        sync: false                # set to https://<your-app>.vercel.app in dashboard
      # Shared secret for the external scheduler trigger
      # (POST /api/internal/cron/expire-subscriptions). Set the SAME value as
      # the GitHub repository secret CRON_TOKEN (see
      # .github/workflows/subscription-expiry.yml) and as CRON_TOKEN on the
      # Vercel project (see web/vercel.json + web/src/app/api/cron/).
      # Unset => the endpoint answers 404 (fail-closed). Expiry still works
      # without it: api/docker/start.sh sweeps on every boot and FeatureGate
      # settles past-due rows lazily on read.
      - key: CRON_TOKEN
        sync: false

# NOTE ON THE MAP:
# Basemap tiles are no longer served by Laravel or any local tile server.
# The frontend uses the Neshan Maps Platform SDK (hosted tiles, Persian
# labels, API key set as NEXT_PUBLIC_NESHAN_MAP_KEY on Vercel) with a
# public OSM raster fallback — nothing map-related to configure here.
#
# NOTE ON REDIS:
# Cache, sessions and the queue run on the golestani-redis Key Value instance
# (Laravel talks to it through predis — pure PHP, no extra PHP extension).
# Locally without Redis, Laravel falls back gracefully: leave CACHE_STORE etc.
# unset so the defaults (database) apply.
#
# NOTE ON THE DATABASE:
# Migrations enable the PostGIS extension and add a `geom` geography column,
# so the DB must be PostGIS-capable. Render's managed PostgreSQL does NOT
# include PostGIS — use a Neon PostGIS database (or Render PostGIS plan) and
# NOTE ON REDIS:
# Cache, sessions and the queue run on the golestani-redis Key Value instance
# (Laravel talks to it through predis — pure PHP, no extra PHP extension).
# Locally without Redis, Laravel falls back gracefully: leave CACHE_STORE etc.
# unset so the defaults (database) apply.
#
# NOTE ON THE DATABASE:
# Migrations enable the PostGIS extension and add a `geom` geography column,
# so the DB must be PostGIS-capable. Render's managed PostgreSQL does NOT
# include PostGIS — use a Neon PostGIS database (or Render PostGIS plan) and
# paste its connection URL into DATABASE_URL in the Render dashboard.
#
# NOTE ON SCHEDULED TASKS (Phase 5 — automatic subscription expiry):
# Laravel registers `subscriptions:expire` on a daily schedule
# (api/bootstrap/app.php), but this plan runs on FREE compute: nothing here
# executes Laravel's scheduler, and Render Cron Job services start at $1/month
# (render.com/docs/cronjobs). Three FREE triggers therefore cover it:
#   1. api/docker/start.sh runs the idempotent sweep on every deploy/restart;
#   2. FeatureGate settles a past-due subscription lazily on the first read, so
#      entitlements and the stored status can never lag behind the clock;
#   3. an outside timer (Vercel Cron in web/vercel.json, or the GitHub Actions
#      workflow .github/workflows/subscription-expiry.yml) POSTs to
#      /api/internal/cron/expire-subscriptions with CRON_TOKEN set above.
# If this service ever moves to a paid plan (or a Render Cron Job is added),
# the same sweep is available as `php artisan subscriptions:expire`.
# A plain Render Postgres instance is intentionally NOT defined here so the
# blueprint doesn't silently create an incompatible database.
