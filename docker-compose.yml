services:
  api-vendor-init:
    image: golestani-php:8.3
    restart: "no"
    volumes:
      - ./api/vendor:/source:ro
      - golestani-api-vendor:/vendor
    command:
      - sh
      - -c
      - if [ ! -f /vendor/autoload.php ]; then cp -a /source/. /vendor/; fi

  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: golestani-php:8.3
    container_name: golestani-api
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - golestani-api-source:/var/www/html
      - golestani-api-vendor:/var/www/html/vendor
      # opcache for the dev CLI server: Laravel boots once per worker instead
      # of re-parsing hundreds of files per request over the slow Windows mount
      - ./docker/php/prod.ini:/usr/local/etc/php/conf.d/zz-prod.ini:ro
      # Per-request log writes (security audit + request timing) measured
      # 1.5s PER LINE on the Windows bind mount (flush stalls) — the whole
      # API felt "dead" (17-57s per request). A Linux volume writes in <1ms.
      # Old logs stay on the host mount; new logs: docker exec + /var/www/html/storage/logs.
      - golestani-logs:/var/www/html/storage/logs
      # Only the opt-in, non-production demo OTP is written to this host-visible file.
      - ./api/storage/logs/otp-demo.log:/var/www/html/storage/logs/otp-demo.log
    ports:
      - "8000:8000"
    environment:
      # The search page fires 6+ parallel requests (search, facets, ads, tiles)
      # that queue behind each other in a single PHP server. Run from public so
      # Laravel's router resolves public/index.php, and let PHP fork workers.
      PHP_CLI_SERVER_WORKERS: 8
      # Redis lives in its own container; inside this one the compose service
      # name resolves it (127.0.0.1 would point at the API container itself).
      # Same reason the worker service sets this — without it the health panel
      # reports Redis as down (connection refused).
      REDIS_HOST: redis
    env_file:
      - ./api/.env
    command:
      - sh
      - -c
      # Laravel serves /storage/* statically only while public/storage resolves:
      # the router script hands any existing file back to the web server, but a
      # broken link falls through to the framework, where the signed local-disk
      # route answers 403. The host's Windows symlink is unusable in here (Docker
      # maps it to /mnt/host/c/...), which is why every uploaded card image
      # rendered as an empty placeholder. A RELATIVE link resolves both inside
      # this container and on the host, so the check recreates it when broken.
      - cd public && [ -e storage/cards ] || { rm -rf storage && ln -s ../storage/app/public storage; }; exec php -S 0.0.0.0:8000 -t . ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php
    networks:
      - golestani-network
    depends_on:
      api-vendor-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./api
          target: /var/www/html
          initial_sync: true
          ignore:
            - vendor/
            - .env
            - .env.*
            - storage/logs/
            - storage/framework/cache/
            - storage/framework/sessions/
            - storage/framework/views/
            - bootstrap/cache/*.php
            - public/storage

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: golestani-php:8.3
    container_name: golestani-worker
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - golestani-api-source:/var/www/html
      - golestani-api-vendor:/var/www/html/vendor
      - golestani-logs:/var/www/html/storage/logs
    environment:
      # queue:work redis needs the compose service name, not the 127.0.0.1 default
      REDIS_HOST: redis
    env_file:
      - ./api/.env
    command: php artisan queue:work redis --sleep=3 --tries=3
    networks:
      - golestani-network
    depends_on:
      api-vendor-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./api
          target: /var/www/html
          initial_sync: true
          ignore:
            - vendor/
            - .env
            - .env.*
            - storage/logs/
            - storage/framework/cache/
            - storage/framework/sessions/
            - storage/framework/views/
            - bootstrap/cache/*.php
            - public/storage

  postgres:
    image: postgis/postgis:16-3.4
    container_name: golestani-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-golestani}
      POSTGRES_USER: ${DB_USERNAME:-golestani}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - golestani-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-golestani}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: golestani-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - golestani-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  golestani-network:
    driver: bridge

volumes:
  golestani-api-source:
    driver: local
  golestani-api-vendor:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  golestani-logs:
    driver: local
