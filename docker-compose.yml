services:
  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: golestani-php:8.3
    container_name: golestani-api
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./api:/var/www/html
      # Local vector tiles (offline basemap) — archives live at the repo root
      # on the host; PMTILES_PATH / MBTILES_PATH point here inside the container.
      - ./iran-shortbread-1.0.mbtiles:/var/www/html/storage/app/iran-shortbread-1.0.mbtiles:ro
      - ./iran-shortbread-1.0.pmtiles:/var/www/html/storage/app/iran-shortbread-1.0.pmtiles:ro
      # opcache for the dev CLI server: Laravel boots once per worker instead
      # of re-parsing hundreds of files per request over the slow Windows mount
      - ./docker/php/prod.ini:/usr/local/etc/php/conf.d/zz-prod.ini:ro
    ports:
      - "8000:8000"
    environment:
      # php -S is single-threaded by default: the search page fires 6+ parallel
      # requests (search, facets, ads, tiles) that then queue behind each other
      # and hit the 15s axios timeout. 8 workers serve them concurrently.
      PHP_CLI_SERVER_WORKERS: 8
    env_file:
      - ./api/.env
    command: php artisan serve --host=0.0.0.0 --port=8000
    networks:
      - golestani-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: golestani-php:8.3
    container_name: golestani-worker
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./api:/var/www/html
      - ./iran-shortbread-1.0.mbtiles:/var/www/html/storage/app/iran-shortbread-1.0.mbtiles:ro
      - ./iran-shortbread-1.0.pmtiles:/var/www/html/storage/app/iran-shortbread-1.0.pmtiles:ro
    environment:
      # queue:work redis needs the compose service name, not the 127.0.0.1 default
      REDIS_HOST: redis
    env_file:
      - ./api/.env
    command: php artisan queue:work redis --sleep=3 --tries=3
    networks:
      - golestani-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgis/postgis:16-3.4
    container_name: golestani-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-golestani}
      POSTGRES_USER: ${DB_USERNAME:-golestani}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - golestani-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-golestani}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: golestani-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - golestani-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  golestani-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
