<!DOCTYPE html>

<html dir="rtl" lang="fa"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={theme:{extend:{"colors":{"background":"#111418","secondary":"#81d8ae","surface-container":"#1d2024","on-surface":"#e1e2e8","on-background":"#e1e2e8"}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-background font-body-md text-on-background flex items-center justify-center min-h-screen"><main class="w-full max-w-md"><div class="flex flex-col w-full relative min-h-screen pb-[80px]">
<!-- Preview Area -->
<div class="w-full bg-surface-container relative p-4 pb-8 shadow-[inset_0_-10px_20px_-10px_rgba(0,0,0,0.5)]">
<div class="absolute top-0 right-0 w-32 h-32 bg-secondary opacity-10 rounded-full blur-[60px]"></div>
<!-- The Card Preview (Midnight Theme) -->
<div class="relative w-[280px] mx-auto bg-surface-dark border-[1px] border-border-white-low rounded-3xl p-6 shadow-xl backdrop-blur-xl transition-transform duration-300 transform scale-100 mt-4 overflow-hidden group">
<div class="absolute -top-10 -right-10 w-24 h-24 bg-glow-emerald rounded-full blur-[40px]"></div>
<div class="flex flex-col items-center">
<!-- Avatar -->
<div class="w-20 h-20 rounded-full border-2 border-secondary/20 p-1 mb-4 relative z-10">
<img class="w-full h-full object-cover rounded-full" data-alt="Professional headshot of a person looking confident, dark background, subtle green lighting accent, high quality portrait" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB3fwSZUfywtwBnxLu-VInmWvXqlNHVAOArE35niZ8Y9OqjymClSx1HgpHra6FUqrsuZhC9eUy2lCYuZYa6SGZH6Nm-3RuzAFLpKulTOyOGQzrJwLhZum2e1mEGQoG-E4d_f-LC_UvEVJvYiGAwxJq_MgAbCdSqU7FH7O5UxouXCKcxRc4E9RyAvq2aW8JhqLJlNT3cBK2JdZqntprd2fv2NCwPXUGZCdXxUFz4MycMolLXRLW73H570g"/>
</div>
<!-- Name & Title -->
<h2 class="text-title-md text-on-surface mb-1 text-center font-bold">علی رضایی</h2>
<p class="text-label-sm text-secondary mb-6 text-center">طراح تجربه کاربری</p>
<!-- Action Buttons -->
<div class="flex gap-3 w-full mb-6">
<button class="flex-1 bg-secondary text-on-secondary py-2 rounded-xl text-label-sm font-bold flex items-center justify-center gap-1 shadow-lg shadow-secondary/20">
<span class="material-symbols-outlined text-[18px]">person_add</span>
                        ذخیره
                    </button>
<button class="flex-1 bg-white/5 border-[1px] border-white/10 text-on-surface py-2 rounded-xl text-label-sm font-bold flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[18px]">share</span>
                        اشتراک
                    </button>
</div>
<!-- Contact Info -->
<div class="w-full space-y-3">
<div class="flex items-center gap-3 p-3 bg-white/5 rounded-xl border-[1px] border-white/5">
<div class="w-8 h-8 rounded-full bg-secondary/10 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined text-[16px]">call</span>
</div>
<span class="text-label-sm text-on-surface text-left dir-ltr">۰۹۱۲ ۳۴۵ ۶۷۸۹</span>
</div>
<div class="flex items-center gap-3 p-3 bg-white/5 rounded-xl border-[1px] border-white/5">
<div class="w-8 h-8 rounded-full bg-secondary/10 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined text-[16px]">mail</span>
</div>
<span class="text-label-sm text-on-surface truncate">ali@example.com</span>
</div>
</div>
</div>
</div>
<!-- Preview Controls overlay -->
<div class="absolute bottom-[-16px] left-1/2 transform -translate-x-1/2 flex items-center gap-2 bg-surface-container-high px-4 py-2 rounded-full border-[1px] border-border-white-low shadow-lg">
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">visibility</span>
<span class="text-caption-xs text-on-surface-variant">پیش‌نمایش زنده</span>
</div>
</div>
<!-- Configuration Area -->
<div class="flex-1 w-full flex flex-col p-6 gap-8 bg-background relative z-10 mt-4">
<!-- Template Selection -->
<div class="flex flex-col gap-3">
<h3 class="text-label-sm text-on-surface-variant px-1">قالب‌ها</h3>
<div class="flex overflow-x-auto gap-4 pb-4 -mx-6 px-6 snap-x">
<!-- Template 1 -->
<div class="snap-center shrink-0 w-[100px] flex flex-col gap-2 items-center cursor-pointer opacity-50 transition-opacity">
<div class="w-full aspect-[2/3] bg-surface-container rounded-lg border-[1px] border-border-white-low p-2 flex flex-col gap-2 relative">
<div class="w-6 h-6 rounded-full bg-surface-variant mx-auto mt-2"></div>
<div class="w-12 h-2 rounded bg-surface-variant mx-auto"></div>
<div class="w-8 h-2 rounded bg-surface-variant mx-auto"></div>
</div>
<span class="text-caption-xs text-on-surface-variant">کلاسیک</span>
</div>
<!-- Template 2 (Active) -->
<div class="snap-center shrink-0 w-[100px] flex flex-col gap-2 items-center cursor-pointer">
<div class="w-full aspect-[2/3] bg-surface-dark rounded-lg border-[2px] border-secondary p-2 flex flex-col gap-2 relative shadow-[0_0_15px_rgba(129,216,174,0.2)]">
<div class="absolute top-1 right-1 w-4 h-4 bg-secondary rounded-full flex items-center justify-center text-on-secondary">
<span class="material-symbols-outlined text-[12px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<div class="w-6 h-6 rounded-full bg-surface-variant mx-auto mt-2"></div>
<div class="w-12 h-2 rounded bg-secondary mx-auto"></div>
<div class="w-8 h-2 rounded bg-surface-variant mx-auto"></div>
</div>
<span class="text-caption-xs text-on-surface font-bold text-secondary">نیمه‌شب</span>
</div>
<!-- Template 3 -->
<div class="snap-center shrink-0 w-[100px] flex flex-col gap-2 items-center cursor-pointer opacity-50 transition-opacity">
<div class="w-full aspect-[2/3] bg-secondary-container rounded-lg border-[1px] border-border-white-low p-2 flex flex-col gap-2 relative">
<div class="w-6 h-6 rounded-full bg-secondary mx-auto mt-2"></div>
<div class="w-12 h-2 rounded bg-secondary mx-auto"></div>
<div class="w-8 h-2 rounded bg-secondary mx-auto"></div>
</div>
<span class="text-caption-xs text-on-surface-variant">زمرد</span>
</div>
</div>
</div>
<!-- Color & Typography Grid -->
<div class="grid grid-cols-2 gap-6">
<!-- Colors -->
<div class="flex flex-col gap-3">
<h3 class="text-label-sm text-on-surface-variant">رنگ‌بندی</h3>
<div class="flex gap-3">
<button class="w-8 h-8 rounded-full bg-secondary border-[2px] border-white flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-on-secondary text-[16px]" style="font-variation-settings: 'FILL' 1;">check</span>
</button>
<button class="w-8 h-8 rounded-full bg-blue-400 border-[2px] border-transparent opacity-70"></button>
<button class="w-8 h-8 rounded-full bg-purple-400 border-[2px] border-transparent opacity-70"></button>
<button class="w-8 h-8 rounded-full bg-orange-400 border-[2px] border-transparent opacity-70"></button>
</div>
</div>
<!-- Font Size -->
<div class="flex flex-col gap-3">
<h3 class="text-label-sm text-on-surface-variant">اندازه متن</h3>
<div class="flex bg-surface-container rounded-xl p-1 border-[1px] border-border-white-low">
<button class="flex-1 py-1 text-on-surface-variant text-caption-xs opacity-50">S</button>
<button class="flex-1 py-1 bg-surface-variant text-on-surface text-label-sm rounded-lg shadow">M</button>
<button class="flex-1 py-1 text-on-surface-variant text-body-md opacity-50">L</button>
</div>
</div>
</div>
</div>
<!-- Sticky Bottom Bar -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-background/80 backdrop-blur-xl border-t-[1px] border-border-white-low flex justify-center max-w-md mx-auto z-50 pb-[calc(1rem+env(safe-area-inset-bottom))]">
<button class="w-full bg-secondary text-on-secondary py-3.5 rounded-2xl text-body-lg font-bold flex items-center justify-center gap-2 shadow-[0_4px_20px_rgba(129,216,174,0.3)] transition-transform active:scale-[0.98]">
<span class="material-symbols-outlined">download</span>
            دانلود کارت
        </button>
</div>
</div></main></body></html>
