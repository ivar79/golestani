<script>
    // Micro-interaction for search input focus adding a subtle glow to the container
    document.addEventListener('DOMContentLoaded', () => {
        const searchInput = document.querySelector('input[type="text"]');
        const searchContainer = searchInput.parentElement;
        
        searchInput.addEventListener('focus', () => {
            searchContainer.classList.add('shadow-[0_0_20px_rgba(0,108,74,0.15)]');
        });
        
        searchInput.addEventListener('blur', () => {
            searchContainer.classList.remove('shadow-[0_0_20px_rgba(0,108,74,0.15)]');
        });
    });
