; Local dev CLI-server performance — mounted only into the compose dev
; containers (api/worker) via docker-compose.yml. The production image
; (api/Dockerfile) ships its own zz-prod.ini; this file must never leak there.
; validate_timestamps=0: re-verifying every included file per request over the
; slow Windows bind mount cost ~2.5s per request (0.1s without it — 25x).
; Consequence: PHP code edits need `docker compose restart api` to show up.

opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=0
opcache.revalidate_freq=2
opcache.jit=tracing
opcache.jit_buffer_size=64M
opcache.memory_consumption=192
opcache.max_accelerated_files=20000

; Laravel stats hundreds of paths at boot; the Windows bind mount makes each
; stat slow, so keep a generous, long-lived realpath cache.
realpath_cache_size=4096K
realpath_cache_ttl=600

memory_limit=256M
upload_max_filesize=20M
post_max_size=20M
expose_php=0
